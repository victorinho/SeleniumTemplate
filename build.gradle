plugins {
    id "java-library"
    id "io.freefair.lombok" version "6.5.1"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

ext {
    junitVersion = "5.10.1"
    junitPlatformVersion = "1.10.1"
    cucumberVersion = "7.15.0" // misma versión en todos los artefactos cucumber-*
}

dependencies {
    testImplementation "org.junit.jupiter:junit-jupiter:$junitVersion"
    testImplementation "org.junit.platform:junit-platform-suite:$junitPlatformVersion"

    testImplementation "io.cucumber:cucumber-java:$cucumberVersion"
    testImplementation "io.cucumber:cucumber-junit-platform-engine:$cucumberVersion"
    testImplementation "io.cucumber:cucumber-picocontainer:$cucumberVersion"

    testImplementation "org.seleniumhq.selenium:selenium-java:4.17.0"
    testImplementation "com.google.guava:32.1.3-jre"
    testImplementation "com.googlecode.json-simple:1.1.1"
    testImplementation "net.masterthought:cucumber-reporting:5.7.7"
    testImplementation "io.qameta.allure:allure-java-commons:2.25.0"
    testImplementation "com.squareup.okhttp3:okhttp:4.12.0"
    testImplementation "jakarta.mail:jakarta.mail-api:2.1.2"
    testImplementation "org.eclipse.angus:jakarta.mail:2.0.2"

    testImplementation "org.slf4j:slf4j-api:2.0.9"
    testRuntimeOnly "org.slf4j:slf4j-simple:2.0.9"
}

test {
    useJUnitPlatform {
        excludeTags "ignore"
    }
    systemProperty "cucumber.execution.main-class", "io.cucumber.core.cli.Main"
}
